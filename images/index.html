<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (path) {
                const url = 'https://raw.githubusercontent.com/KirianCaumes/Inflamesdiscography-restored/refs/heads/main/images/data/' + encodeURIComponent(path);
                window.location.replace(url);
            } else {
                document.body.innerText = 'No path specified.';
            }
        });
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
